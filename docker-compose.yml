services:
  db:
    image: postgres:latest
    container_name: "auth_db"
    ports:
        - "5432:5432"
    restart: always
    environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: 12345678
        POSTGRES_DB: auth_db
  cache:
    image: redis:latest
    container_name: "auth_cache"
    ports:
        - "6379:6379"
    restart: always
    environment:
        REDIS_PASSWORD: 12345678