spring.application.name=auth_service
server.forward-headers-strategy=native

# Authentication config
jwt.access-token-secret=${ACCESS_TOKEN_SECRET}
session.lifetime-seconds=604800
refresh-token.grace-period-seconds=10
login-reference.expiration-seconds=900

# MFA config
mfa.ticket-expiration-seconds=900
mfa.code-expiration-seconds=300

# Database connection
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auth_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}

# Redis connection
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:12345678}

# JPA config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect